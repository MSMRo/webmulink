    <script>
      // Redirigir a /docs/ únicamente si se sirve el archivo fuente sin compilar en GitHub Pages (branch root)
      if (window.location.hostname.endsWith('github.io') && document.querySelector('script[src*="main.tsx"]')) {
        var base = window.location.pathname.replace(/\/?$/, '/docs/');
        window.location.replace(base + window.location.search + window.location.hash);
      }
